<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}
</style></head><body><canvas id="c" width="1920" height="1080"></canvas><script>
const W=1920,H=1080,c=document.getElementById('c');let g=c.getContext('2d');
const FONT='"Noto Serif CJK SC","Noto Serif CJK TC",serif';
const BEAT=60/106, BAR=BEAT*4, T0=0.136;
const beatPhase=t=>((t-T0)/BEAT)%1;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
const eo=k=>1-Math.pow(1-k,3);
const ramp=(t,a,b)=>clamp((t-a)/(b-a));
function rng(s){return()=>(s=(s*16807)%2147483647)/2147483647}

// ---------- lyrics (start times estimated from bar grid + vocal analysis) ----------
const LYR=[
 [18.9,'二零二三年  二月的人民广场'],
 [22.75,'来福士的火锅  热气轻轻在晃'],
 [27.2,'第一次心动的我  一开口就慌张'],
 [31.6,'你却好奇地问东问西  笑得像太阳'],
 [36.6,'那天走了很远  一直走到外滩'],
 [41.2,'江边的高楼  一栋一栋点亮'],
 [45.5,'我偷偷地想  这城市原来这么梦幻'],
 [50.0,'是因为身边  有你在场'],
 [54.7,null],
];

// ---------- shared assets ----------
function mk(w,h,f){const cv=document.createElement('canvas');cv.width=w;cv.height=h;f(cv.getContext('2d'),w,h);return cv}
const grain=mk(W,H,(x,w,h)=>{const r=rng(3);for(let i=0;i<90000;i++){x.fillStyle=`rgba(255,240,210,${r()*0.05})`;x.fillRect(r()*w,r()*h,1.6,1.6)}
 for(let i=0;i<40000;i++){x.fillStyle=`rgba(0,0,20,${r()*0.06})`;x.fillRect(r()*w,r()*h,1.6,1.6)}});
const vignette=mk(W,H,(x,w,h)=>{const v=x.createRadialGradient(w/2,h/2,h*.35,w/2,h/2,h*1.05);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,10,.55)');x.fillStyle=v;x.fillRect(0,0,w,h)});
const STARS=(()=>{const r=rng(11),a=[];for(let i=0;i<420;i++)a.push({x:r()*W*1.6-W*.3,y:r()*H*1.1-H*.05,s:r()*1.7+.3,p:r()*6.28,f:.5+r()*2,born:r()*9});return a})();

function sky(top,mid,bot){const s=g.createLinearGradient(0,0,0,H);s.addColorStop(0,top);s.addColorStop(.6,mid);s.addColorStop(1,bot);g.fillStyle=s;g.fillRect(0,0,W,H)}
function stars(t,alpha=1,par=0,maxY=H,bornScale=1){
 for(const s of STARS){const y=s.y;if(y>maxY)continue;const a=alpha*clamp((t*bornScale-s.born)/1.5)*(.45+.55*Math.sin(t*s.f+s.p)**2);
  if(a<=.01)continue;const x=((s.x-par*s.s*.6)%(W*1.6)+W*1.6)%(W*1.6)-W*.3;
  g.fillStyle=`rgba(255,238,200,${a})`;g.beginPath();g.arc(x,y,s.s,0,7);g.fill()}}
function glowDot(x,y,r,a=1,col='255,222,150'){const rg=g.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,`rgba(${col},${a})`);rg.addColorStop(.25,`rgba(${col},${a*.45})`);rg.addColorStop(1,`rgba(${col},0)`);g.fillStyle=rg;g.beginPath();g.arc(x,y,r,0,7);g.fill();
 if(r<=200){g.fillStyle=`rgba(255,250,235,${a})`;g.beginPath();g.arc(x,y,r*.09+1,0,7);g.fill()}}
function moon(x,y,r,phase,a=1,glow=1){ // phase: illuminated fraction, waxing (lit on right)
 g.save();g.globalAlpha=a;
 const h=g.createRadialGradient(x,y,r*.8,x,y,r*(2.6+glow));h.addColorStop(0,`rgba(255,228,170,${.25*glow})`);h.addColorStop(1,'rgba(255,228,170,0)');g.fillStyle=h;g.beginPath();g.arc(x,y,r*(2.6+glow),0,7);g.fill();
 g.fillStyle='rgba(70,80,125,.5)';g.beginPath();g.arc(x,y,r,0,7);g.fill();
 const k=1-2*phase;g.fillStyle='#ffecc0';g.beginPath();g.arc(x,y,r,-Math.PI/2,Math.PI/2,false);g.ellipse(x,y,r*Math.abs(k),r,0,Math.PI/2,-Math.PI/2,k>0);g.fill();
 g.restore()}
// little people: him (cream) & her (rose)
function person(x,y,s,who,o={}){g.save();g.translate(x,y);g.scale(s,s);
 const bob=o.walk?Math.abs(Math.sin(o.walk*Math.PI))*-3:0;g.translate(0,bob);
 const col=who==='he'?'#f3d9a4':'#f7b9aa';g.fillStyle=col;
 if(who==='he'){g.beginPath();g.moveTo(-12,0);g.lineTo(-8,-40);g.quadraticCurveTo(0,-46,8,-40);g.lineTo(12,0);g.closePath();g.fill();
  g.beginPath();g.arc(0,-55,11,0,7);g.fill()}
 else{g.beginPath();g.moveTo(-15,0);g.quadraticCurveTo(-6,-20,-6,-36);g.quadraticCurveTo(0,-41,6,-36);g.quadraticCurveTo(6,-20,15,0);g.closePath();g.fill();
  g.beginPath();g.arc(0,-49,10,0,7);g.fill();g.beginPath();g.arc(6,-58,5,0,7);g.fill()} // hair bun
 if(o.walk){g.strokeStyle=col;g.lineWidth=3;g.lineCap='round';const sw=Math.sin(o.walk*Math.PI)*5;g.beginPath();g.moveTo(-4,0);g.lineTo(-4-sw,8);g.moveTo(4,0);g.lineTo(4+sw,8);g.stroke()}
 g.restore()}
function handLink(x1,y1,x2,y2,a=1){g.save();g.globalAlpha=a;g.strokeStyle='#f6d3a8';g.lineWidth=3.2;g.lineCap='round';g.beginPath();g.moveTo(x1,y1);g.quadraticCurveTo((x1+x2)/2,Math.max(y1,y2)+10,x2,y2);g.stroke();g.restore()}

function caption(t){
 let i=-1;for(let k=0;k<LYR.length;k++)if(t>=LYR[k][0])i=k;
 if(i<0||!LYR[i][1])return;
 const [st,txt]=LYR[i],en=LYR[i+1]?LYR[i+1][0]:st+5;
 const a=clamp((t-st)/.35)*clamp((en-t)/.35);
 g.save();g.textAlign='center';g.textBaseline='middle';g.font=`400 52px ${FONT}`;
 const chars=[...txt],n=chars.length,reveal=(t-st)/Math.min(1.4,(en-st)*.45)*n;
 const full=g.measureText(txt).width;let x=W/2-full/2;
 for(let j=0;j<n;j++){const ch=chars[j],w=g.measureText(ch).width,ca=clamp(reveal-j)*a;
  if(ca>0){const dk=window.capDark&&window.capDark(t);g.globalAlpha=ca;g.shadowColor=dk?'rgba(255,250,240,.6)':'rgba(255,196,120,.75)';g.shadowBlur=dk?8:20;g.fillStyle=dk?'#5a3a2e':'#fff4da';g.fillText(ch,x+w/2,985+ (1-ca)*10)}x+=w}
 g.restore()}
function stamp(t,a,line1,line2,x=110,y=96){if(a<=0)return;g.save();g.globalAlpha=a;g.textAlign='left';g.textBaseline='alphabetic';
 g.fillStyle='rgba(255,226,170,.85)';g.font=`400 28px ${FONT}`;g.fillText(line1,x,y);
 if(line2){g.fillStyle='rgba(255,226,170,.55)';g.font=`300 23px ${FONT}`;g.fillText(line2,x,y+40)}
 g.strokeStyle='rgba(255,226,170,.4)';g.lineWidth=1;g.beginPath();g.moveTo(x,y+14);g.lineTo(x+60,y+14);g.stroke();g.restore()}

// ---------- SCENE: intro 0 – 18.9 ----------
function sIntro(t){
 sky('#05081a','#0b1230','#141a3c');
 stars(t,1,t*2,H,1.3);
 // the first star: a bright one center-top pulsing with whistle
 const fs=clamp((t-.5)/1.5);const kk=ease(clamp((t-12.6)/2.2));const sx=lerp(W/2,1500,kk),sy=lerp(300,250,kk)-Math.sin(kk*Math.PI)*90;const fade=1-clamp((t-14.6)/.7);
 if(kk>0&&kk<1){for(let j=1;j<14;j++){const k2=Math.max(0,kk-j*.025);glowDot(lerp(W/2,1500,k2),lerp(300,250,k2)-Math.sin(k2*Math.PI)*90,16-j,(1-j/14)*.5*fade);}}
 glowDot(sx,sy,60+8*Math.sin(t*2),fs*.9*fade);
 // title
 const title='宇宙只有一个月亮';const ta=clamp((t-2.8)/1)*clamp((15.2-t)/1.4);
 if(ta>0){g.save();g.textAlign='center';g.textBaseline='middle';g.font=`500 104px ${FONT}`;
  const chars=[...title];let tw=0;const ws=chars.map(ch=>{const w=g.measureText(ch).width+18;tw+=w;return w});let x=W/2-tw/2;
  chars.forEach((ch,j)=>{const ca=clamp((t-2.8-j*.32)/.9)*ta;const key=(ch==='宇'||ch==='月');
   g.globalAlpha=ca;g.shadowColor=key?'rgba(255,200,110,1)':'rgba(255,220,170,.5)';g.shadowBlur=key?34+10*Math.sin(t*3):14;
   g.fillStyle=key?'#ffd98a':'#fff1d6';g.fillText(ch,x+ws[j]/2,520-(1-eo(ca))*16);x+=ws[j]});
  g.shadowBlur=0;const sa=clamp((t-6.8)/1.2)*ta;g.globalAlpha=sa;g.font=`300 34px ${FONT}`;g.fillStyle='rgba(255,226,180,.85)';
  g.fillText('写给她 · 三十二岁生日',W/2,640);
  g.font=`300 24px ${FONT}`;g.globalAlpha=sa*.7;g.fillText('2026.11.24',W/2,692);g.restore()}
 // descent toward the first night: crescent appears
 const ma=clamp((t-14.5)/1.2);if(ma>0)moon(1500,250,80,0.21,ma*clamp((19.4-t)/.5+1));
 stamp(t,clamp((t-15.3)/1)*clamp((19.3-t)/.4),'2023.01.26 · 加上微信','那晚的月亮：一弯蛾眉月 · 21%');
}

// ---------- SCENE: hotpot at Raffles 18.9 – 36.4 ----------
const STEAM=(()=>{const r=rng(5),a=[];for(let i=0;i<160;i++)a.push({x:r()*2-1,born:r()*20,sp:.6+r()*.8,w:r()*6.28,s:r()*1.6+.6});return a})();
function sHotpot(t,lt){ // lt = local time
 // warm interior
 const s=g.createLinearGradient(0,0,0,H);s.addColorStop(0,'#1d1634');s.addColorStop(1,'#3a2440');g.fillStyle=s;g.fillRect(0,0,W,H);
 // window to the night
 const wx=460,wy=70,ww=1000,wh=470;
 g.save();g.beginPath();g.roundRect(wx,wy,ww,wh,18);g.clip();
 const ns=g.createLinearGradient(0,wy,0,wy+wh);ns.addColorStop(0,'#0a1131');ns.addColorStop(1,'#1b2452');g.fillStyle=ns;g.fillRect(wx,wy,ww,wh);
 stars(t+20,.9,0,wy+wh);moon(wx+ww-150,wy+120,58,.21,1,.8);
 // distant city in window
 const r=rng(9);for(let x=wx;x<wx+ww;){const bw=30+r()*60,bh=60+r()*160;g.fillStyle='#141936';g.fillRect(x,wy+wh-bh,bw,bh);
  for(let yy=wy+wh-bh+10;yy<wy+wh-6;yy+=16)for(let xx=x+6;xx<x+bw-6;xx+=12)if(r()<.35){g.fillStyle=`rgba(255,200,120,${.35+r()*.4})`;g.fillRect(xx,yy,5,7)}x+=bw+4}
 g.restore();
 g.strokeStyle='rgba(255,210,140,.5)';g.lineWidth=3;g.beginPath();g.roundRect(wx,wy,ww,wh,18);g.stroke();
 g.beginPath();g.moveTo(wx+ww/2,wy);g.lineTo(wx+ww/2,wy+wh);g.stroke();
 // lamp glow
 const lg=g.createRadialGradient(W/2,600,20,W/2,640,700);lg.addColorStop(0,'rgba(255,170,90,.35)');lg.addColorStop(1,'rgba(255,170,90,0)');g.fillStyle=lg;g.fillRect(0,0,W,H);
 // table
 g.fillStyle='#2a1a2c';g.fillRect(0,760,W,320);g.strokeStyle='rgba(255,210,140,.55)';g.lineWidth=2.5;g.beginPath();g.moveTo(300,760);g.lineTo(W-300,760);g.stroke();
 // people seated
 const nerv=ramp(lt,27.2-18.9,27.6-18.9)*clamp((31.85-18.9-lt)/.4);
 const shake=nerv*Math.sin(t*40)*2.2;
 person(640+shake,760,3.0,'he');person(1280,760,2.9,'she');
 // hotpot (yuanyang)
 const px=W/2,py=735;g.save();
 g.fillStyle='#3b2433';g.beginPath();g.ellipse(px,py,150,40,0,0,7);g.fill();
 g.fillStyle='#d8513e';g.beginPath();g.ellipse(px,py-4,138,34,0,Math.PI/2,Math.PI*1.5);g.fill();
 g.fillStyle='#f2dfc2';g.beginPath();g.ellipse(px,py-4,138,34,0,-Math.PI/2,Math.PI/2);g.fill();
 g.strokeStyle='#ffd08a';g.lineWidth=3;g.beginPath();g.ellipse(px,py,150,40,0,0,7);g.stroke();
 g.beginPath();g.moveTo(px,py-38);g.lineTo(px,py+30);g.stroke();
 g.beginPath();g.moveTo(px-150,py);g.lineTo(px-138,py+70);g.lineTo(px+138,py+70);g.lineTo(px+150,py);g.stroke();
 g.restore();
 // steam → stars
 const intens=.55+.45*ramp(lt,22.75-18.9,24-18.9);
 for(const p of STEAM){const age=((lt+p.born)*p.sp)%9;const y=py-30-age*70;const x=px+p.x*110+Math.sin(age*1.3+p.w)*30*(age/3);
  const toStar=clamp((wy+wh-y)/160);const a=clamp(age/1)*clamp((9-age)/1.5)*intens;
  if(toStar<1){g.fillStyle=`rgba(255,240,225,${a*.10*(1-toStar)})`;g.beginPath();g.arc(x,y,16+age*7,0,7);g.fill()}
  if(toStar>0){glowDot(x,y,10*p.s,a*toStar*.9)}}
 // "……" nervous bubble
 if(nerv>0){g.save();g.globalAlpha=nerv;g.fillStyle='rgba(255,240,220,.92)';g.beginPath();g.roundRect(560,495,130,62,30);g.fill();
  g.beginPath();g.moveTo(600,555);g.lineTo(615,580);g.lineTo(625,555);g.fill();
  g.fillStyle='#3a2440';for(let k=0;k<3;k++){g.beginPath();g.arc(595+k*30,526,6,0,7);g.fill()}
  // sweat drop
  g.fillStyle='#bfe3ff';g.beginPath();g.ellipse(680,560,6,9,0,0,7);g.fill();g.restore()}
 // her curiosity + sunshine
 const sun=ramp(lt,32.0-18.9,32.6-18.9);
 if(sun>0){g.save();g.translate(1280,600);g.globalAlpha=sun;
  const sg=g.createRadialGradient(0,0,10,0,0,260);sg.addColorStop(0,'rgba(255,214,120,.55)');sg.addColorStop(1,'rgba(255,214,120,0)');g.fillStyle=sg;g.beginPath();g.arc(0,0,260,0,7);g.fill();
  g.rotate(t*.25);g.strokeStyle='rgba(255,214,130,.55)';g.lineWidth=4;g.lineCap='round';
  for(let k=0;k<12;k++){g.rotate(Math.PI/6);g.beginPath();g.moveTo(150,0);g.lineTo(150+22+10*Math.sin(t*4+k),0);g.stroke()}g.restore();
  g.save();g.font=`600 54px ${FONT}`;g.textAlign='center';
  [[1180,480,0],[1330,440,.5],[1420,520,1],[1240,400,1.6],[1380,360,2.2]].forEach(([x,y,d])=>{const a=clamp((lt-(32.0-18.9)-d)/.4)*clamp((36.2-18.9-lt)/.5);if(a<=0)return;
   g.globalAlpha=a;g.fillStyle='#ffe3a8';g.shadowColor='rgba(255,200,120,.8)';g.shadowBlur=14;g.fillText('?',x+Math.sin(t*2+d)*6,y-(lt-12.7-d)*10)});g.restore()}
 g.drawImage(vignette,0,0);
 stamp(t,clamp(lt/1)*clamp((17.2-lt)/.5),'上海 · 人民广场 来福士','第一次见面，一顿火锅');
}

// ---------- SCENE: walk to the Bund 36.4 – 56 ----------
function lujiazui(x0,base,lit,t){ // lit: array 0..1 per building
 const B=[ // [type,x,w,h]
  ['box',0,90,190],['box',100,70,250],['jinmao',190,80,420],['box',290,110,210],['swfc',420,90,470],['shtower',530,100,560],
  ['box',650,80,230],['pearl',770,90,470],['box',900,120,200],['box',1035,70,280],['box',1120,100,180],['box',1235,85,240]];
 B.forEach(([ty,bx,bw,bh],i)=>{const x=x0+bx,L=lit[i]||0;g.save();
  g.fillStyle=`rgb(${lerp(20,38,L)|0},${lerp(24,32,L)|0},${lerp(50,66,L)|0})`;
  g.strokeStyle=`rgba(${lerp(160,255,L)|0},${lerp(150,206,L)|0},${lerp(190,125,L)|0},${.35+.55*L})`;g.lineWidth=2.2;
  g.beginPath();
  if(ty==='box'){g.rect(x,base-bh,bw,bh)}
  else if(ty==='jinmao'){for(let k=0;k<6;k++){const w=bw*(1-k*.13),hh=bh*(.45-.05*k);}
   g.moveTo(x,base);g.lineTo(x+bw*.1,base-bh*.55);g.lineTo(x+bw*.2,base-bh*.8);g.lineTo(x+bw*.35,base-bh*.93);g.lineTo(x+bw*.5,base-bh);g.lineTo(x+bw*.65,base-bh*.93);g.lineTo(x+bw*.8,base-bh*.8);g.lineTo(x+bw*.9,base-bh*.55);g.lineTo(x+bw,base);g.closePath()}
  else if(ty==='swfc'){g.moveTo(x,base);g.lineTo(x+bw*.18,base-bh);g.lineTo(x+bw*.82,base-bh);g.lineTo(x+bw,base);g.closePath();
   g.moveTo(x+bw*.32,base-bh*.93);g.lineTo(x+bw*.68,base-bh*.93);g.lineTo(x+bw*.68,base-bh*.86);g.lineTo(x+bw*.32,base-bh*.86);g.closePath()}
  else if(ty==='shtower'){g.moveTo(x,base);g.bezierCurveTo(x+bw*.05,base-bh*.5,x+bw*.25,base-bh*.85,x+bw*.42,base-bh);g.lineTo(x+bw*.62,base-bh*.97);g.bezierCurveTo(x+bw*.78,base-bh*.8,x+bw*.95,base-bh*.5,x+bw,base);g.closePath()}
  if(ty!=='pearl'){g.fill('evenodd');g.stroke()}
  if(ty==='pearl'){const cx=x+bw/2;g.lineWidth=3;
   g.beginPath();g.moveTo(cx-34,base);g.lineTo(cx-8,base-bh*.33);g.moveTo(cx+34,base);g.lineTo(cx+8,base-bh*.33);g.moveTo(cx,base);g.lineTo(cx,base-bh*.33);g.moveTo(cx,base-bh*.33);g.lineTo(cx,base-bh*.9);g.moveTo(cx,base-bh*.9);g.lineTo(cx,base-bh);g.stroke();
   [[base-bh*.33,44],[base-bh*.72,30],[base-bh*.88,12]].forEach(([yy,r])=>{g.beginPath();g.arc(cx,yy,r,0,7);g.fill();g.stroke();
    if(L>0){g.fillStyle=`rgba(255,120,170,${.45*L})`;g.beginPath();g.arc(cx,yy,r-4,0,7);g.fill();g.fillStyle=`rgb(${lerp(20,38,L)|0},${lerp(24,32,L)|0},${lerp(50,66,L)|0})`}});
   g.beginPath();g.rect(cx-6,base-bh*.66,12,bh*.27);g.fill();g.stroke()}
  // windows
  if(L>0&&ty!=='pearl'){const r=rng(100+i);g.save();g.clip();
   for(let yy=base-bh+14;yy<base-8;yy+=20)for(let xx=x+8;xx<x+bw-8;xx+=16)if(r()<.7){g.fillStyle=`rgba(255,${200+r()*40|0},${120+r()*50|0},${(.45+r()*.55)*L})`;g.fillRect(xx,yy,7,9)}
   g.restore();
   // tower crown light
   g.fillStyle=`rgba(255,220,150,${L*.9})`;}
  // reflection
  if(L>0){const r=rng(300+i);for(let k=0;k<9;k++){const ww=bw*(.25+r()*.4)*(1-k*.05);g.fillStyle=`rgba(255,${190+r()*40|0},130,${.16*L*(1-k/10)})`;g.fillRect(x+bw/2-ww/2+Math.sin(t*1.5+k+i)*6,base+18+k*15,ww,3)}}
  g.restore()});
}
function sBund(t,lt){ // lt: since 36.4
 const T=t;
 sky('#070d26','#141f4a','#2a2a5a');
 const magic=ramp(t,45.5,47.5);
 if(magic>0){const m=g.createRadialGradient(W*.6,H*.2,50,W*.6,H*.3,1100);m.addColorStop(0,`rgba(170,120,255,${.18*magic})`);m.addColorStop(1,'rgba(170,120,255,0)');g.fillStyle=m;g.fillRect(0,0,W,H)}
 // camera: slow pan, then push in at L8
 const push=ease(ramp(t,50,55));const panX=-lt*14;
 stars(t+40,1+magic*.4,lt*3,700);
 moon(1580,210,78,.21,1,1+ramp(t,50,53)*1.6);
 g.save();
 const fx=1180,fy=880;g.translate(fx,fy);g.scale(1+push*.28,1+push*.28);g.translate(-fx,-fy);
 // river
 const rv=g.createLinearGradient(0,640,0,H);rv.addColorStop(0,'#141a44');rv.addColorStop(1,'#0b0f2a');g.fillStyle=rv;g.fillRect(-400,640,W+800,600);
 // lit sequence: one building per beat from 41.2
 const lit=[];const order=[5,7,4,2,0,9,3,1,6,8,10,11];
 order.forEach((bi,k)=>{const st=41.2+k*BEAT*.75;lit[bi]=clamp((t-st)/.25)});
 const pre=ramp(t,36.4,40);order.forEach(bi=>lit[bi]=Math.max(lit[bi],0));
 lujiazui(240+panX*.4,640,lit,t);
 // sparkles on magic
 if(magic>0){const r=rng(77);for(let k=0;k<70;k++){const x=r()*W,y=r()*620,ph=r()*6.28;const a=magic*Math.max(0,Math.sin(t*2.2+ph))**4;if(a>.02)glowDot(x,y,14,a*.8,'255,215,240')}}
 // promenade (foreground)
 g.fillStyle='#0a0c20';g.fillRect(-400,880,W+800,400);g.strokeStyle='rgba(255,210,140,.45)';g.lineWidth=2;g.beginPath();g.moveTo(-400,880);g.lineTo(W+400,880);g.stroke();

 for(let k=-2;k<40;k++){const x=((k*90+panX*1.6)%(W+400)+W+400)%(W+400)-200;g.strokeStyle='rgba(255,210,140,.25)';g.beginPath();g.moveTo(x,880);g.lineTo(x,846);g.stroke()}
 g.beginPath();g.moveTo(-400,846);g.lineTo(W+400,846);g.stroke();
 // couple walking until 50, then stop and hold hands

 person(cx,880,1.9,'he',{walk:walking});person(cx+62,880,1.78,'she',{walk:walking?walking+.5:0});
 handLink(cx+14,880-62,cx+50,880-58,ramp(t,49.5,51));
 // first star of their constellation above them

 g.restore();
 g.drawImage(vignette,0,0);
 stamp(t,ramp(t,36.8,37.8)*clamp((49.5-t)/.6),'上海 · 外滩','从人民广场，一直走到江边');
